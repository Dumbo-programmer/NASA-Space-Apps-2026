name: data-ml-api-dashboard

on:
  push:
    paths: ["data/**", "models/**", "api/**", "tests/**", "agnishikha-ui/**", "run_pipeline.py", "requirements*.txt", ".github/workflows/ml-pipeline.yml"]
  pull_request:
    paths: ["data/**", "models/**", "api/**", "tests/**", "agnishikha-ui/**", "run_pipeline.py", "requirements*.txt"]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Reproducible ETL, data contract and tests (data, models, API)
        run: python run_pipeline.py --only etl validate tests

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agnishikha-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agnishikha-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
